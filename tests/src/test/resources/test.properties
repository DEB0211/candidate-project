# Bond Issuance System - test configuration.
# Every value can be overridden with a -D system property or an environment
# variable of the same name (system property wins over env var wins over this file).

# Backend REST API
api.baseUri=http://localhost:8080

# Web frontend
ui.baseUrl=http://localhost:5173

# SFTP (bond ingestion)
sftp.host=localhost
sftp.port=2222
sftp.username=bonduser
sftp.password=bondpass
sftp.remoteDir=/upload/bonds

# Selenium
ui.headless=true
ui.browser=chrome
# Implicit/explicit wait ceiling in seconds
ui.timeoutSeconds=15

# How long (seconds) to poll after an SFTP upload before a bond is expected to appear
ingestion.pollSeconds=30

# System timezone (per PRODUCT.md section 12)
business.timezone=Asia/Kuala_Lumpur
